<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physics Tube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="دروس الفيزياء للمرحلة الثانوية: فيديوهات شرح، مختبر تفاعلي، ومذكرات PDF.">
<meta name="theme-color" content="#0A0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physics Tube">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one dark phone-width column; wordmark header, grade switcher, swipeable promo cards, 2-up unit tiles, floating glass tab bar */
:root {
  --bg: #0A0B0F;
  --surface: #15171D;
  --surface-2: #1F222A;
  --line: rgba(255, 255, 255, .08);
  --fg: #F5F5F7;
  --muted: #8C8F9A;
  --accent: #2F8CFF;
  --good: #32D17A;
  --on-light: #0A0B0F;
  --glass: rgba(26, 28, 34, .78);
  --font: -apple-system, BlinkMacSystemFont, "SF Arabic", "SF Pro Text", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mark: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --r-lg: 28px;
  --r-md: 22px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

#app {
  direction: rtl;
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 130px;
  min-height: 100%;
}
.view { animation: rise .38s cubic-bezier(.2, .8, .2, 1); }
.view.push { animation: slide .42s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } }
@keyframes slide { from { opacity: .3; transform: translateX(-28px); } }

/* Header */
.top { direction: ltr; display: flex; align-items: center; justify-content: space-between; padding-block: 14px 6px; }
.mark { font-family: var(--font-mark); font-weight: 600; font-size: 17px; letter-spacing: .22em; color: var(--fg); white-space: nowrap; }
.mark b { font-weight: 800; }
.pill {
  display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
}
.pill .stat { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; background: #1A2232; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
.pill .stat svg { color: var(--accent); }
.pill .me { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.grade-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 22px 18px; }
.grade-row h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.link { color: var(--accent); font-weight: 700; font-size: 17px; white-space: nowrap; }

/* Promo cards */
.promos {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-right, 0px))) calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px));
  scroll-padding-inline: max(16px, env(safe-area-inset-right, 0px));
}
.promos::-webkit-scrollbar { display: none; }
.promo {
  flex: 0 0 84%; scroll-snap-align: start; position: relative; overflow: hidden; text-align: right;
  border-radius: var(--r-lg); padding: 26px 22px 22px; min-height: 360px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--pbg); border: 1px solid rgba(255, 255, 255, .06);
  transition: transform .2s;
}
.promo:active, .unit:active, .row:active { transform: scale(.98); }
.promo h2 { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -.015em; }
.promo p { font-size: 17px; color: rgba(255, 255, 255, .82); max-width: 30ch; }
.badge { align-self: flex-start; background: #fff; color: var(--on-light); font-weight: 700; font-size: 15px; padding: 6px 13px; border-radius: 12px; }
.promo .art { position: absolute; left: 8px; bottom: 54px; width: 54%; max-width: 210px; pointer-events: none; }
.promo .foot { margin-top: auto; font-size: 17px; font-weight: 500; position: relative; }

/* Section heading */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-block: 34px 14px; font-size: 22px; font-weight: 800; }
.sec small { font-size: 14px; font-weight: 500; color: var(--muted); }

/* Unit tiles */
.units { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.unit {
  position: relative; aspect-ratio: 1 / 1.04; max-width: 100%; border-radius: var(--r-md); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 14px 16px; text-align: right;
  background: var(--tile); border: 1px solid rgba(255, 255, 255, .05); transition: transform .2s;
}
.unit .glyph { position: absolute; inset: 14% 0 auto; margin: auto; width: 54%; }
.unit .eyebrow { position: relative; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .7); }
.unit-name { padding-block: 4px 10px; font-size: 15px; color: var(--fg); }
.units + .unit-name { padding-top: 22px; }
.unit h3 { position: relative; font-size: 18px; font-weight: 700; line-height: 1.3; }
.unit .chip { position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 9px; background: rgba(255, 255, 255, .92); color: var(--on-light); font-variant-numeric: tabular-nums; }
.unit .bar { position: absolute; inset: auto 0 0; height: 3px; background: rgba(255, 255, 255, .12); }
.unit .bar i { display: block; height: 100%; background: #fff; }

.glyph { display: block; overflow: visible; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .55)) drop-shadow(0 0 16px var(--glow, transparent)); }
.glyph .gb { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.glyph .gg { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transform: translate(-1px, -1.5px); }
.glyph .gg .f { fill: rgba(255, 255, 255, .22); }

/* Continue card */
.cont { display: flex; align-items: center; gap: 14px; margin-top: 26px; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-align: right; width: 100%; }
.cont .thumb { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--tile); flex: none; }
.cont .thumb .glyph { width: 40px; }
.cont .txt { flex: 1; min-width: 0; }
.cont .txt small { color: var(--muted); font-size: 13px; }
.cont .txt b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont .go { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--on-light); display: grid; place-items: center; flex: none; }

/* Pushed pages */
.nav { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.circle { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.hero {
  position: relative; border-radius: var(--r-lg); overflow: hidden; padding: 24px 22px 22px; min-height: 250px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; background: var(--tile);
}
.hero .glyph { position: absolute; top: 20px; left: 20px; width: 92px; }
.hero small { color: rgba(255, 255, 255, .75); font-size: 14px; font-weight: 600; }
.hero h1 { font-size: 30px; font-weight: 800; line-height: 1.2; position: relative; }
.prog { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.prog .track { flex: 1; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .18); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: #fff; border-radius: 6px; }
.row .n .glyph { width: 24px; }

.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--line); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: right; transition: transform .2s, background .2s; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: rgba(255, 255, 255, .025); }
.row .n { min-width: 36px; padding-inline: 4px; width: auto; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; flex: none; }
.row .n.done { background: rgba(50, 209, 122, .16); color: var(--good); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 16px; }
.row .t small { color: var(--muted); font-size: 13px; }
.row .end { color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 13px; flex: none; }
.row .end.on { color: var(--accent); }
.soon { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 3px 9px; border-radius: 8px; }

/* Lesson */
.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: #000; border: 1px solid var(--line); }
.player iframe, .player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.player.tall { aspect-ratio: 9 / 16; width: min(100%, 56vh); margin-inline: auto; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
.poster { position: absolute; inset: 0; display: grid; place-items: center; background: var(--tile); text-align: center; padding: 16px; }
.poster .glyph { width: 84px; position: absolute; top: 16px; left: 16px; opacity: .9; }
.poster .playbtn { width: 68px; height: 68px; border-radius: 50%; background: rgba(255, 255, 255, .95); color: var(--on-light); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.poster .playbtn .ico { width: 28px; height: 28px; fill: currentColor; stroke: none; transform: translateX(2px); }
.poster .msg { display: grid; gap: 4px; justify-items: center; }
.poster .msg b { font-size: 18px; }
.poster .msg span { color: rgba(255, 255, 255, .75); font-size: 14px; }
.lesson-h { padding-block: 20px 4px; display: grid; gap: 4px; }
.lesson-h small { color: var(--muted); font-weight: 600; font-size: 14px; }
.lesson-h h1 { font-size: 26px; font-weight: 800; line-height: 1.25; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 15px; text-align: center; }
.btn.primary { background: #fff; color: var(--on-light); border-color: #fff; }
.btn.done { background: rgba(50, 209, 122, .14); color: var(--good); border-color: rgba(50, 209, 122, .3); }
.btn.wide { grid-column: 1 / -1; }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.next { margin-top: 26px; }
.label { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; padding-block: 0 10px; }

/* Lab */
.page-h { padding-block: 20px 6px; display: grid; gap: 6px; }
.page-h h1 { font-size: 32px; font-weight: 800; }
.page-h p { color: var(--muted); font-size: 16px; }
.sims { display: grid; gap: 12px; margin-top: 18px; }
.sim-card { position: relative; display: flex; align-items: flex-end; min-height: 150px; padding: 18px; border-radius: var(--r-md); overflow: hidden; background: var(--tile); text-align: right; width: 100%; transition: transform .2s; }
.sim-card:active { transform: scale(.98); }
.sim-card .glyph { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 92px; }
.sim-card .t { position: relative; display: grid; gap: 3px; max-width: 62%; }
.sim-card small { color: rgba(255, 255, 255, .75); font-size: 13px; font-weight: 600; }
.sim-card b { font-size: 21px; }
.sim-card span { color: rgba(255, 255, 255, .8); font-size: 14px; }

.stage { border-radius: var(--r-md); overflow: hidden; background: #07080B; border: 1px solid var(--line); position: relative; }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; max-width: 100%; }
.readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.readout div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.readout small { color: var(--muted); font-size: 12px; font-weight: 600; }
.readout b { font-size: 18px; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; white-space: nowrap; }
.controls { display: grid; gap: 4px; margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 16px; }
.ctl { display: grid; gap: 6px; padding-block: 10px; }
.ctl + .ctl { border-top: 1px solid var(--line); }
.ctl label { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
.ctl label output { color: var(--accent); font-variant-numeric: tabular-nums; direction: ltr; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; direction: ltr; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--surface-2) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 6px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--surface-2) var(--p, 50%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { padding: 7px 4px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.term-seg { margin-bottom: 14px; padding: 4px; border-radius: 14px; }
.term-seg button { padding: 10px 4px; font-size: 15px; border-radius: 11px; }
.seg button[aria-pressed="true"] { background: #3A3D46; color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.law { margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 15px; }
.law code { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); direction: ltr; unicode-bidi: isolate; font-size: 15px; }

/* Notes */
.unitgroup { margin-top: 18px; }

/* Profile */
.me-card { display: flex; align-items: center; gap: 16px; margin-top: 18px; padding: 18px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #2F8CFF, #6A1FD1); font-size: 26px; font-weight: 800; flex: none; }
.me-card .t { flex: 1; min-width: 0; display: grid; gap: 4px; }
.me-card input { width: 100%; background: transparent; border: 0; color: var(--fg); font: inherit; font-size: 20px; font-weight: 700; padding: 0; }
.me-card input::placeholder { color: var(--muted); }
.me-card small { color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 2px; }
.stats b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 13px; }
.admin-bar { width: 100%; text-align: right; cursor: pointer; }
.admin-bar span { flex: 1; }
.me-card.guest .avatar { background: var(--surface-2); color: var(--muted); }
.me-card .t b { display: block; }
.dash-btn { margin-top: 12px; width: 100%; }
.auth-seg { margin-top: 16px; }
.field select { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 16px; }
.stats4 { grid-template-columns: repeat(2, 1fr); }
.stats4 small.up { color: var(--good); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; color: var(--fg); }
.chart { display: block; width: 100%; height: auto; }
.row.student .t small { display: block; }
.visits { display: grid; justify-items: center; color: var(--fg); }
.visits b { font-size: 17px; font-variant-numeric: tabular-nums; }
.visits small { color: var(--muted); font-size: 11px; }
.sheet.auth-sheet { padding-top: 0; background: #0D1220; border-color: rgba(47, 140, 255, .25); }
.sheet.auth-sheet .grab { position: relative; z-index: 2; margin: 10px auto 0; background: rgba(255, 255, 255, .35); }
.auth-hero { position: relative; overflow: hidden; margin: -15px calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0; padding: 34px 24px 26px; text-align: center;
  background: radial-gradient(120% 90% at 50% 0%, #2F6BFF 0%, #1546D6 38%, #0B1E5C 72%, #0D1220 100%); }
.auth-orbits { position: absolute; inset: 0; pointer-events: none; }
.auth-orbits i { position: absolute; left: 50%; top: 58px; width: 340px; height: 110px; margin-left: -170px; border: 1.5px solid rgba(255, 255, 255, .14); border-radius: 50%; }
.auth-orbits i:nth-child(2) { transform: rotate(60deg); } .auth-orbits i:nth-child(3) { transform: rotate(-60deg); }
.auth-logo { position: relative; width: 84px; height: 84px; border-radius: 22px; display: block; margin: 0 auto 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, .4), 0 0 0 3px rgba(255, 255, 255, .25); }
.auth-hero h2 { position: relative; font-size: 25px; color: #fff; }
.auth-hero p { position: relative; margin-top: 6px; color: rgba(255, 255, 255, .8); font-size: 15px; }
.auth-sheet .auth-seg { margin-top: 18px; background: #161D33; }
.auth-sheet .auth-seg button[aria-pressed="true"] { background: linear-gradient(135deg, #2F8CFF, #1546D6); color: #fff; box-shadow: 0 4px 14px rgba(47, 140, 255, .35); }
.auth-form { display: grid; gap: 14px; margin-top: 18px; }
.afield { display: grid; gap: 6px; min-width: 0; }
.auth-form, .ainput { min-width: 0; }
.ainput input[type="password"], .ainput input[type="tel"] { width: 0; }
.afield label { font-size: 13px; font-weight: 600; color: #9FB4E0; }
.ainput { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #141A2C; border: 1.5px solid #222B45; transition: border-color .2s, box-shadow .2s; }
.ainput:focus-within { border-color: #2F8CFF; box-shadow: 0 0 0 4px rgba(47, 140, 255, .18); }
.ainput > .ico { color: #5E8DF0; width: 20px; height: 20px; }
.ainput input, .ainput select { flex: 1; min-width: 0; height: 50px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; outline: none; }
.ainput input::placeholder { color: #4D5A78; }
.ainput select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.ainput input[dir="ltr"] { text-align: left; }
.peek { color: #5E8DF0; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; }
.peek.on { background: rgba(47, 140, 255, .18); }
.auth-go { margin-top: 4px; min-height: 56px; border: 0; color: #fff; font-size: 17px; background: linear-gradient(135deg, #3B95FF 0%, #1F5BEA 60%, #1546D6 100%); box-shadow: 0 12px 28px rgba(31, 91, 234, .45); }
.auth-go:active { transform: scale(.98); }
.auth-foot { text-align: center; margin-top: 2px; }

.install { margin-top: 12px; padding: 16px; border-radius: var(--r-md); background: linear-gradient(135deg, #10203F, #0B1226); border: 1px solid rgba(47, 140, 255, .25); display: grid; gap: 6px; }
.install b { font-size: 16px; }
.install p { color: rgba(255, 255, 255, .78); font-size: 14px; }

/* Tab bar */
.tabbar {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(488px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; direction: rtl;
  border-radius: 30px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
}
.tab { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; border-radius: 24px; color: #A3A6B0; font-size: 11px; font-weight: 600; transition: background .25s, color .25s; }
.tab .ico { width: 24px; height: 24px; }
.tab[aria-current="page"] { background: #2A2D35; color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .55); animation: fade .25s; }
.sheet {
  position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(520px, 100%); max-height: 86vh; overflow: auto; direction: rtl;
  background: #17191F; border: 1px solid var(--line); border-bottom: 0; border-radius: 30px 30px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: up .36s cubic-bezier(.2, .8, .2, 1);
}
.sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: #3A3D46; margin: 0 auto 16px; }
.sheet h2 { font-size: 24px; font-weight: 800; }
.sheet > p { color: var(--muted); margin-top: 6px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--surface-2); border: 1.5px solid transparent; text-align: right; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: #1A2232; }
.opt .thumb { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--tile); flex: none; }
.opt .thumb .glyph { width: 34px; }
.opt .t { flex: 1; display: grid; }
.opt .t small { color: var(--muted); font-size: 13px; }
.opt .tick { color: var(--accent); }
.qr-box { margin: 18px auto 0; width: min(240px, 70%); padding: 16px; border-radius: 22px; background: #fff; }
.qr-box .qr { display: block; width: 100%; height: auto; }
.share-url { margin-top: 12px; text-align: center; font-size: 14px; color: var(--muted); word-break: break-all; user-select: all; -webkit-user-select: all; }
.pill .me + .me { margin-inline-start: -4px; }
.perks { display: grid; gap: 12px; margin-top: 18px; padding: 0; list-style: none; }
.perks li { display: flex; gap: 12px; align-items: center; font-size: 16px; }
.perks li .ico { color: var(--good); }
.sheet .btn { margin-top: 20px; width: 100%; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translate(-50%, 100%); } }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); background: #fff; color: var(--on-light); font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: fade .2s; width: max-content; max-width: calc(100% - 32px); text-align: center; }

/* Teacher mode */
.admin-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(255, 165, 58, .12); border: 1px solid rgba(255, 165, 58, .3); color: #FFC27A; font-size: 14px; font-weight: 600; }
.editor { margin-top: 18px; padding: 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid rgba(255, 165, 58, .35); display: grid; gap: 10px; }
.ed-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ed-h b { font-size: 17px; }
.tag { font-size: 12px; font-weight: 700; color: #FFC27A; background: rgba(255, 165, 58, .14); padding: 3px 9px; border-radius: 8px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 16px; }
.field input[type="url"], .field input[type="email"], .field input[type="password"] { direction: ltr; text-align: left; }
.field input:focus { outline: none; border-color: var(--accent); }
.ed-file { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.ed-file .t { flex: 1 1 140px; min-width: 0; font-size: 14px; color: var(--muted); }
.ed-file .t b { display: block; color: var(--fg); font-size: 15px; }
.ed-file .btn { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.ed-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed-list { display: grid; gap: 8px; }
.ed-vid { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--surface-2); }
.ed-vid .t { flex: 1 1 140px; min-width: 0; display: grid; gap: 4px; }
.ed-vid .t small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vthumb { width: 72px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; display: grid; place-items: center; flex: none; }
.vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vthumb span { font-size: 10px; font-weight: 700; color: var(--muted); text-align: center; padding: 2px; }
.vtitle { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 15px; font-weight: 600; }

.vpos { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.vpos select { min-height: 36px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 15px; font-weight: 700; }
.circle.sm { width: 36px; height: 36px; flex: none; }
.circle.sm .ico { width: 18px; height: 18px; }
.circle.danger { color: #FF7A7A; }
.circle.confirm { background: #FF5A5A; color: #fff; }
.now { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--accent); font-size: 14px; font-weight: 600; }
.playlist { margin-top: 14px; }
.playlist.sortable .row { transition: transform .18s ease, box-shadow .18s; }
.sortable, .sortable *:not(input):not(select) { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ed-list.sortable .ed-vid { transition: transform .18s ease, box-shadow .18s; }
.ed-list.sorting .ed-vid.lifted { transition: box-shadow .18s; position: relative; z-index: 3; background: #2B2F3A; box-shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 0 0 1.5px var(--accent); }
.ed-vid .grip { width: 36px; height: 44px; margin-inline-start: 0; }
.grip { display: grid; place-items: center; width: 44px; height: 44px; margin-inline-start: auto; color: var(--muted); touch-action: none; cursor: grab; flex: none; }
.grip .ico { width: 24px; height: 24px; }
body.dragging { -webkit-user-select: none; user-select: none; overflow: hidden; }
.playlist.sorting { overflow: visible; }
.playlist .row.lifted { transition: box-shadow .18s; position: relative; z-index: 3; background: #262A35; border-radius: 16px; box-shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 0 0 1.5px var(--accent); }
.playlist .row.on { background: rgba(47, 140, 255, .08); }
.playlist .row.on .n { background: var(--accent); color: #fff; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.err { color: #FF7A7A; font-size: 14px; min-height: 1em; }
.btn.danger { color: #FF7A7A; }
.btn.busy { opacity: .6; pointer-events: none; }

/* Daily challenge */
.daily { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 18px; padding: 16px; border-radius: var(--r-md); text-align: right; overflow: hidden;
  background: radial-gradient(120% 140% at 0% 100%, rgba(255,176,32,.5), transparent 60%), radial-gradient(100% 120% at 100% 0%, rgba(255,77,122,.4), transparent 60%), #2A170B; border: 1px solid rgba(255,176,32,.35); }
.daily:not(.done):active { transform: scale(.98); }
.daily .dic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.14); font-size: 26px; flex: none; }
.daily .t { flex: 1; min-width: 0; display: grid; gap: 2px; } .daily .t b { font-size: 18px; } .daily .t small { color: rgba(255,255,255,.78); font-size: 13px; }
.daily .qb-go { color: #2A170B; }
.daily.done { background: var(--surface); border-color: var(--line); } .daily.done .t b { font-size: 16px; } .daily.done .t small { color: var(--muted); }
/* Scientist ranks */
.rank { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 12px; padding: 14px 16px; border-radius: var(--r-md); text-align: right;
  background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 22%, var(--surface)), var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--rc) 35%, var(--line)); }
.rank:active { transform: scale(.98); }
.rank .medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; flex: none; background: color-mix(in srgb, var(--rc) 25%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rc) 55%, transparent); }
.rank .t { flex: 1; min-width: 0; display: grid; gap: 4px; }
.rank .t b { font-size: 18px; display: flex; align-items: baseline; gap: 8px; } .rank .xp { font-size: 13px; color: var(--rc); font-weight: 700; }
.rank small { color: var(--muted); font-size: 12.5px; }
.rank .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; } .rank .bar i { display: block; height: 100%; background: var(--rc); border-radius: 3px; }
.ranks { display: grid; gap: 10px; margin-top: 16px; }
.rk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); }
.rk .m { font-size: 24px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--rc) 22%, transparent); flex: none; }
.rk .t { flex: 1; display: grid; } .rk small { color: var(--muted); font-size: 13px; }
.rk.lock { opacity: .45; } .rk.lock .m { filter: grayscale(1); } .rk.cur { outline: 2px solid var(--rc); }
.earn { margin-top: 16px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); } .earn b { color: var(--fg); }
.celebrate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; padding: 24px; overflow: hidden; animation: fade .3s;
  background: radial-gradient(60% 40% at 50% 40%, color-mix(in srgb, var(--rc) 45%, transparent), transparent 70%), rgba(5,7,12,.94); }
.celebrate .big { font-size: 110px; line-height: 1.25; margin-bottom: 6px; animation: medal .9s cubic-bezier(.2, .8, .2, 1.3); }
@keyframes medal { 0% { transform: scale(.2) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.15) rotate(8deg); } }
.celebrate h1 { font-size: 30px; } .celebrate p { color: var(--muted); } .celebrate .btn { min-width: 220px; }
.card-prev { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 18px; margin-top: 14px; background: #000; }
/* Predict-then-try and lab missions */
.pred { margin-top: 14px; padding: 16px; border-radius: var(--r-md); background: linear-gradient(150deg, rgba(168,102,255,.2), var(--surface) 70%); border: 1px solid rgba(168,102,255,.35); display: grid; gap: 10px; }
.pred .ph { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #C79BFF; }
.pred h3 { font-size: 17px; line-height: 1.6; }
.pred .po { display: grid; gap: 8px; }
.pred .po button { text-align: right; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1.5px solid transparent; font-weight: 600; transition: transform .15s, border-color .2s; }
.pred .po button:active { transform: scale(.98); }
.pred .po button.mine { border-color: #C79BFF; } .pred .po button.right { border-color: var(--good); background: rgba(50,209,122,.14); } .pred .po button.wrong { border-color: #FF6B6B; background: rgba(255,107,107,.12); }
.pred .po button[disabled] { cursor: default; }
.pred .why { font-size: 14px; line-height: 1.7; color: #D6DAE3; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.25); animation: rise .3s; }
.pred .why code { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.pred .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.pred .row2 .btn { flex: 1; margin: 0; min-height: 44px; }
.pred.mini { grid-template-columns: 1fr auto; align-items: center; padding: 12px 16px; }
.pred.mini b { font-size: 14px; } .pred.mini button { color: #C79BFF; font-weight: 700; font-size: 14px; }
.missions { margin-top: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.missions .mh { display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
.missions .mh .st { color: #FFC83D; letter-spacing: 2px; font-size: 18px; }
.mi { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; transition: color .3s; }
.mi:first-of-type { border-top: 0; }
.mi .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; flex: none; font-size: 14px; transition: background .3s, border-color .3s; }
.mi.done { color: var(--muted); } .mi.done span.tx { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
.mi.done .ck { background: var(--good); border-color: var(--good); color: #062B16; }
.mi.flash { animation: pop .5s cubic-bezier(.2, .8, .2, 1.4); }
.sim-stars { display: inline-block; margin-top: 4px; color: #FFC83D; font-size: 13px; letter-spacing: 1px; }
.law code { direction: ltr; unicode-bidi: isolate; }
/* Physics games */
.games-card { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 16px; padding: 16px; border-radius: var(--r-md); text-align: right; overflow: hidden;
  background: radial-gradient(120% 140% at 0% 100%, rgba(255,77,122,.5), transparent 60%), radial-gradient(100% 120% at 100% 0%, rgba(76,134,255,.5), transparent 60%), #160E2E; border: 1px solid rgba(160,140,255,.35); }
.games-card:active { transform: scale(.98); }
.games-card .gi { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.14); font-size: 28px; flex: none; }
.games-card .t { flex: 1; min-width: 0; display: grid; gap: 2px; } .games-card .t b { font-size: 18px; } .games-card .t small { color: rgba(255,255,255,.78); font-size: 13px; }
.games-card .qb-go { color: #160E2E; }
.g-list { display: grid; gap: 14px; margin-top: 18px; }
.g-tile { display: flex; align-items: center; gap: 16px; padding: 20px 18px; border-radius: var(--r-lg); text-align: right; width: 100%; position: relative; overflow: hidden;
  background: radial-gradient(120% 130% at 0% 100%, var(--g1), transparent 65%), linear-gradient(160deg, var(--g2), #0A0B0F); border: 1px solid rgba(255,255,255,.12); }
.g-tile:active { transform: scale(.98); }

.g-tile .t { flex: 1; display: grid; gap: 3px; } .g-tile small { color: rgba(255,255,255,.7); font-size: 12px; font-weight: 700; } .g-tile b { font-size: 21px; } .g-tile .t > span { color: rgba(255,255,255,.82); font-size: 14px; }
.g-prog { margin-top: 6px; color: #FFC83D !important; font-weight: 700; font-size: 13px !important; }
.g-hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 24px 20px; display: grid; gap: 4px; justify-items: start;
  background: radial-gradient(120% 130% at 0% 100%, var(--g1), transparent 65%), linear-gradient(160deg, var(--g2), #0A0B0F); }
.g-hero small { color: rgba(255,255,255,.7); font-weight: 700; } .g-hero h1 { font-size: 28px; } .g-hero p { color: rgba(255,255,255,.82); }
.g-levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.g-lv { display: grid; justify-items: center; gap: 4px; padding: 14px 6px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.g-lv:active { transform: scale(.96); }
.g-lv b { font-size: 26px; } .g-lv small { color: var(--muted); font-size: 12px; min-height: 2.6em; } .g-lv span { color: #FFC83D; letter-spacing: 1px; }
.g-lv.lock { opacity: .4; }
.g-head { display: grid; gap: 4px; padding-top: 4px; } .g-head small { color: var(--muted); font-weight: 700; font-size: 13px; } .g-head h1 { font-size: 26px; }
.g-head p { color: #D6DAE3; font-size: 15px; line-height: 1.8; margin-top: 4px; }
.g-stage { margin-top: 14px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: #000; }
.g-stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; }
.g-bar { display: flex; gap: 10px; margin-top: 14px; } .g-bar .btn { margin: 0; } .g-bar .btn.primary { flex: 1; }
.g-res { margin-top: 16px; padding: 18px; border-radius: var(--r-md); display: grid; gap: 8px; text-align: center; animation: rise .4s; }
.g-res.ok { background: linear-gradient(160deg, rgba(50,209,122,.18), var(--surface)); border: 1px solid rgba(50,209,122,.4); }
.g-res.no { background: linear-gradient(160deg, rgba(255,107,107,.16), var(--surface)); border: 1px solid rgba(255,107,107,.4); }
.g-res h2 { font-size: 21px; } .g-res p { font-size: 14px; line-height: 1.9; color: #D6DAE3; text-align: right; }
.g-res code { display: block; direction: ltr; unicode-bidi: isolate; text-align: center; background: rgba(0,0,0,.28); padding: 8px 10px; border-radius: 10px; margin: 6px 0; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.g-stars { font-size: 40px; color: #FFC83D; letter-spacing: 6px; animation: pop .6s cubic-bezier(.2, .8, .2, 1.4); } .g-stars span { color: rgba(255,255,255,.18); }
.g-res .g-bar { flex-wrap: wrap; } .g-res .g-bar .btn { flex: 1; min-width: 120px; }
/* Live class quiz */
.wide #app { max-width: 1100px; }
.wide .tabbar { display: none; }
.live-hero { text-align: center; padding: 26px 18px; border-radius: var(--r-lg); display: grid; gap: 6px;
  background: radial-gradient(90% 120% at 10% 110%, #6A1FD1 0%, transparent 60%), radial-gradient(90% 100% at 100% 0%, #D61F6A 0%, transparent 65%), #120E2A; }
.live-hero small { color: rgba(255,255,255,.75); font-size: 14px; }
.live-code { font-family: var(--font-mark); font-size: 88px; font-weight: 800; letter-spacing: .14em; direction: ltr; line-height: 1.1; }
.wide .live-code { font-size: 150px; }
.live-players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.live-players span { padding: 8px 14px; border-radius: 999px; background: var(--surface-2); font-weight: 600; animation: pop .4s; }
.wide .live-players span { font-size: 20px; padding: 10px 18px; }
.live-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }

.live-timer { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 800; background: var(--surface-2); border: 3px solid var(--accent); flex: none; }

.live-q { font-size: 24px; font-weight: 700; line-height: 1.55; margin: 18px 0; text-align: center; }
.wide .live-q { font-size: 40px; }
.live-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.live-opt { display: flex; align-items: center; gap: 12px; min-height: 92px; padding: 14px 16px; border-radius: 18px; background: var(--lc); color: #fff; font-weight: 700; font-size: 17px; text-align: right;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--lc) 55%, #000); transition: transform .12s, box-shadow .12s, opacity .3s; }

const predState = () => store.get('pred', {});
function predictHTML(k) {

  return `<div class="pred" id="pred" data-order="${order.join(',')}">

  </div>`;
}
function predictAct(k, act, el) {
  const all = predState(), box = document.getElementById('pred'), cur = all[k] || {};
  if (act === 'pred-pick') {
    all[k] = { pick: +el.dataset.i, order: box.dataset.order.split(',').map(Number), ok: +el.dataset.i === 0, shown: false };
    store.set('pred', all); box.outerHTML = predictHTML(k);
  } else if (act === 'pred-show') {
    const p = PREDICT[k];
    if (!cur.done) addXP(cur.ok ? 10 : 3);
    all[k] = Object.assign(cur, { shown: true, done: true, again: false }); store.set('pred', all);
    box.querySelectorAll('.po button').forEach(b => { const i = +b.dataset.i; b.disabled = true; b.classList.toggle('right', i === 0); b.classList.toggle('wrong', i === cur.pick && i !== 0); });
    box.querySelector('.row2').outerHTML = `<div class="why"><b>${cur.ok ? '✅ توقّعك صحيح!' : '💡 توقّعك لم يكن صحيحاً، وهذا طبيعي'}</b><br>${p.why}</div>`;
    if (cur.ok) box.classList.add('flash');
  } else if (act === 'pred-again') {
    all[k] = { again: true, done: cur.done }; store.set('pred', all); box.outerHTML = predictHTML(k);
  }
}

// Watches the controls and ticks off goals as the student reaches them.
function missionWatch(k, P) {
  const M = MISSIONS[k]; if (!M) return 0;
  const mem = M.map(() => ({}));
  return setInterval(() => {
    const all = store.get('missions', {}), d = all[k] = all[k] || [];
    M.forEach((m, i) => {
      if (d[i]) return;
      let ok = false; try { ok = m.ok(P, mem[i]); } catch (e) {}
      if (!ok) return;
      d[i] = 1; store.set('missions', all); addXP(15);
      const row = document.getElementById('mi' + i);
      if (row) { row.classList.add('done', 'flash'); row.querySelector('.ck').textContent = '✓'; }
      const n = d.filter(Boolean).length, stEl = document.getElementById('mstars'); if (stEl) stEl.textContent = starStr(n);
      if (n === M.length) { addXP(20); toast('⭐⭐⭐ أنجزت كل مهمات التجربة! +35 نقطة'); } else toast('🎯 أنجزت المهمة! +15 نقطة');
    });
  }, 350);
}

function dailyChart(daily) {
  const days = [], map = Object.fromEntries((daily || []).map(x => [x.d, x.n]));
  for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5), k = d.toLocaleDateString('en-CA', { timeZone: 'Asia/Kuwait' }); days.push([k, map[k] || 0]); }
  const max = Math.max(1, ...days.map(d => d[1])), W = 600, H = 160, bw = W / days.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 24}" role="img" aria-label="عدد مرات الدخول في آخر 30 يوماً">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="currentColor" stroke-opacity=".15"/>
    ${days.map(([k, n], i) => { const h = n / max * (H - 18); return `<rect x="${i * bw + 2}" y="${H - h}" width="${bw - 4}" height="${Math.max(h, n ? 3 : 1)}" rx="3" fill="${i === days.length - 1 ? 'var(--accent)' : 'rgba(47,140,255,.45)'}"><title>${k}: ${n}</title></rect>`; }).join('')}

/* ---------------- Simulations ---------------- */
let simStop = null;
function startSim(k) {
  const cv = document.getElementById('cv'); if (!cv) return;
  track('s', `${S.grade}.${k}`);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = 800, H = 500; cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.direction = 'ltr';
  const P = {}, ro = document.getElementById('ro'), D = Math.PI / 180;
  const fmt = (x, d = 2) => Number(x).toFixed(d);
  let t0 = performance.now(), raf, st = {}, lastT = 0;
  const reset = () => { t0 = performance.now(); st = {}; };
  SIMCTL[k].forEach(c => {
    if (c.type === 'btn') return;
    if (c.type === 'seg') {
      P[c.id] = c.opts[0].v;
      document.querySelectorAll(`[data-seg="${c.id}"]`).forEach(b => b.onclick = () => {
        document.querySelectorAll(`[data-seg="${c.id}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
        P[c.id] = +b.dataset.v; if (!c.keep) reset();
      });
      return;
    }
    const el = document.getElementById(c.id), out = document.getElementById(c.id + '-o');
    const dec = c.step < 1 ? (c.step < .1 ? 2 : 1) : 0;
    const sync = () => { P[c.id] = +el.value; out.textContent = `${fmt(el.value, dec)} ${c.unit}`.trim(); el.style.setProperty('--p', ((el.value - c.min) / (c.max - c.min) * 100) + '%'); };
    el.oninput = () => { sync(); if (!c.keep) reset(); }; sync();
  });
  document.querySelectorAll('[data-simbtn]').forEach(b => b.onclick = () => {
    if (b.dataset.simbtn === 'cut') st.cutReq = true;
    else { reset(); if (b.dataset.simbtn === 'drop') st.drop = true; }
  });

  const setRO = items => { const h = items.map(([a, b]) => `<div><small>${a}</small><b>${b}</b></div>`).join(''); if (ro.innerHTML !== h) ro.innerHTML = h; };
  const grid = () => {
    ctx.fillStyle = '#07080B'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

        const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
        cv.addEventListener('pointerdown', e => {
          const [x, y] = pt(e);
          const o = st.objs && st.objs.filter(q => q.hit).sort((a, b) => Math.hypot(a.hit[0] - x, a.hit[1] - y) - Math.hypot(b.hit[0] - x, b.hit[1] - y))[0];

        label(n, x, ty - 24, '#07080B', 'center', 18);
        if (Math.abs(vv) > .05) arrow(x, ty - 80, x + vv * 9, ty - 80, c, 4);

  };
  const loop = now => { lastT = (now - t0) / 1000; draws[k](lastT); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  const mw = missionWatch(k, P);
  simStop = () => { cancelAnimationFrame(raf); clearInterval(mw); };
}

/* Teacher mode: long-press a lesson part (or grab its handle), then drag it to a new position.
   Touch events are used on phones because iOS only lets a non-passive touchmove stop the page from scrolling. */
const drag = { timer: 0, active: false, suppressClick: false };
function setupReorder() { document.querySelectorAll('.sortable[data-key]').forEach(makeSortable); }
function makeSortable(list) {
  const rows = [...list.querySelectorAll(':scope > .row, :scope > .ed-vid')];
  let cur = null;
  const begin = (row, i, y) => {
    cur = { row, i, y, target: i, h: rows.length > 1 ? Math.abs(rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top) : row.offsetHeight };
    drag.active = true; list.classList.add('sorting'); row.classList.add('lifted'); document.body.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12);
  };
  const moveTo = y => {
    if (!cur) return;
    const dy = y - cur.y, { row, i, h } = cur;
    cur.target = Math.max(0, Math.min(rows.length - 1, i + Math.round(dy / h)));
    row.style.transform = `translateY(${dy}px) scale(1.03)`;
    rows.forEach((r, j) => { if (r !== row) r.style.transform = (i < j && j <= cur.target) ? `translateY(${-h}px)` : (cur.target <= j && j < i) ? `translateY(${h}px)` : ''; });
  };
  const finish = commit => {
    clearTimeout(drag.timer);
    if (!cur) return;
    const { row, i, target } = cur; cur = null;
    drag.active = false; drag.suppressClick = true; setTimeout(() => { drag.suppressClick = false; }, 450);
    list.classList.remove('sorting'); row.classList.remove('lifted'); document.body.classList.remove('dragging');
    if (!commit || target === i) { rows.forEach(r => { r.style.transform = ''; }); return; }
    const key = list.dataset.key, vids0 = currentVideos(key), [moved] = vids0.splice(i, 1); vids0.splice(target, 0, moved);
    const playing = S.vi || 0;
    S.vi = playing === i ? target : (i < playing && playing <= target) ? playing - 1 : (target <= playing && playing < i) ? playing + 1 : playing;
    saveVideos(key, vids0).then(ok => { if (ok) toast(`نُقل الجزء إلى الترتيب ${target + 1}`); else rows.forEach(r => { r.style.transform = ''; }); });
  };
  rows.forEach((row, i) => {
    const grip = row.querySelector('.grip');
    // Touch: the handle drags at once; anywhere else on the row needs a long press.
    row.addEventListener('touchstart', e => {
      if (e.touches.length > 1) return;
      const t = e.touches[0], sx = t.clientX, sy = t.clientY;
      if (grip && grip.contains(e.target)) { e.preventDefault(); begin(row, i, sy); return; }
      if (e.target.closest('input, select, textarea, a, [data-act]:not(.row)')) return;
      clearTimeout(drag.timer);
      drag.timer = setTimeout(() => begin(row, i, sy), 380);
      row._start = { sx, sy };
    }, { passive: false });
    row.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (drag.active && cur && cur.row === row) { e.preventDefault(); moveTo(t.clientY); return; }
      const st0 = row._start; if (st0 && Math.hypot(t.clientX - st0.sx, t.clientY - st0.sy) > 8) clearTimeout(drag.timer);
    }, { passive: false });
    row.addEventListener('touchend', e => { if (cur && cur.row === row) { e.preventDefault(); finish(true); } else clearTimeout(drag.timer); });
    row.addEventListener('touchcancel', () => finish(false));
    // Mouse (computers): same long press, or drag the handle.
    row.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button > 0) return;
      const sy = e.clientY, sx = e.clientX, onGrip = grip && grip.contains(e.target);
      if (!onGrip && e.target.closest('input, select, textarea, a, [data-act]:not(.row)')) return;
      const mm = ev => { if (cur) moveTo(ev.clientY); else if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) up(); };
      const up = () => { window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', up); finish(true); };
      window.addEventListener('pointermove', mm); window.addEventListener('pointerup', up);
      if (onGrip) { e.preventDefault(); begin(row, i, sy); } else drag.timer = setTimeout(() => begin(row, i, sy), 380);
    });
  });
}

function planSheet() {
  const g = G();
  sheet(`<h2>${esc(g.name)}</h2><p>كل ما تحتاجه لمادة الفيزياء في صفك.</p>
    <ul class="perks">
      <li>${icon('checkc')}شرح فيديو لكل دروس المنهج</li>
      <li>${icon('checkc')}مذكرة PDF لكل وحدة</li>
      <li>${icon('checkc')}تجارب تفاعلية في المختبر</li>
      <li>${icon('checkc')}متابعة تقدّمك درساً بدرس</li>
    </ul>
    <button class="btn primary" data-act="start">ابدأ التعلّم الآن</button>`);
}

document.addEventListener('click', e => {
  if (drag.suppressClick) { drag.suppressClick = false; e.preventDefault(); return; }
  const el = e.target.closest('[data-go],[data-tab],[data-act],[data-grade],[data-term],[data-fkind]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  if (el.dataset.fkind) { S.fileKind = el.dataset.fkind; return render(false); }
  if (el.dataset.term) { S.term = +el.dataset.term; store.set('term', S.term); return render(false); }
  if (el.dataset.go) { closeSheet(); return go(el.dataset.go, el.dataset.replace); }
  if (el.dataset.tab) { closeSheet(); if (S.tab === el.dataset.tab && !S.stack.length) return window.scrollTo({ top: 0, behavior: 'smooth' }); return transition('tab', () => { S.tab = el.dataset.tab; S.stack = []; render(); }); }
  if (el.dataset.grade) {
    S.grade = el.dataset.grade; store.set('grade', S.grade); store.set('gradePicked', true); closeSheet(); S.stack = []; render();
    return toast(`تم التغيير إلى ${GRADES[S.grade].name}`);
  }
  const act = el.dataset.act;
  if (act === 'back') transition('back', () => { S.stack.pop(); render(); });
  else if (act === 'grade') gradeSheet();
  else if (act === 'plan') planSheet();
  else if (act === 'close') closeSheet();
  else if (act === 'start') { closeSheet(); S.tab = 'home'; S.stack = []; go('unit:0'); }
  else if (act === 'watched') {
    const k = el.dataset.key; S.watched[k] = !S.watched[k]; if (!S.watched[k]) delete S.watched[k];
    store.set('watched', S.watched); render(false);
    if (S.watched[k]) toast('أحسنت! تم حفظ تقدّمك');
  }
  else if (act === 'share') shareSheet();
  else if (act === 'share-send') shareSend();
  else if (act === 'share-copy') shareCopy();
  else if (act === 'login') authSheet('login');
  else if (act === 'signup') authSheet('signup');
  else if (act === 'logout') { db && db.auth.signOut(); USER = ADMIN = PROFILE = null; S.stack = S.stack.filter(x => x.type !== 'admin' && x.type !== 'lesson'); render(false); toast('تم تسجيل الخروج'); }
  else if (act === 'admin-refresh') { ADMIN_DATA.at = 0; loadAdmin(); }
  else if (act === 'q-pick') { if (!Q.ans[Q.i]) quizAnswer({ pick: +el.dataset.k, ok: +el.dataset.k === 0 }); }
  else if (act === 'q-check') {
    const inp = document.getElementById('q-in'), raw = (inp.value || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫', '.').replace(',', '.').replace('−', '-');
    if (raw === '' || isNaN(+raw)) { inp.focus(); return toast('اكتب الناتج رقماً، مثل 12.5'); }
    quizAnswer({ val: raw, ok: qNumOk(Q.md.qs[Q.i], +raw) });
  }
  else if (act === 'q-next') { if (Q.i + 1 < Q.md.qs.length) { Q.i++; render(); } else quizFinish(); }
  else if (act === 'q-retry') {
    if (Q.m >= 0) startQuiz(Q.m);
    else if (!startMistakes()) { S.stack.pop(); render(); return toast('أحسنت! لم يتبقَّ أخطاء للمراجعة 🎉'); }
    render();
  }
  else if (act === 'rings') ringsSheet();
  else if (act === 'rank') rankSheet();
  else if (act && act.startsWith('g-') && typeof gameAct === 'function') gameAct(act);
  else if (act === 'pred-pick' || act === 'pred-show' || act === 'pred-again') { const t = S.stack[S.stack.length - 1]; if (t && t.type === 'sim') predictAct(t.k, act, el); }
  else if (act === 'live-new') liveModelSheet();
  else if (act === 'live-host') liveHost(+el.dataset.m);
  else if (act === 'live-joinsheet') { if (!USER) authSheet('login', liveJoinSheet); else liveJoinSheet(); }
  else if (act === 'live-join') liveJoin(document.getElementById('live-code').value);
  else if (act === 'live-pick') liveAnswer(+el.dataset.k);
  else if (act === 'live-go') liveSet({ phase: 'question', q: 0 });
  else if (act === 'live-reveal') liveSet({ phase: 'reveal' });
  else if (act === 'live-next') { const r = LIVE.room, n = liveQs(r).length; liveSet(r.q + 1 < n ? { phase: 'question', q: r.q + 1 } : { phase: 'end' }); }
  else if (act === 'live-close') { if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'اضغط مرة أخرى لإنهاء المسابقة وحذفها'; return; } db.from('live_rooms').delete().eq('code', LIVE.code).then(() => {}); liveStop(); LIVE.code = ''; transition('back', () => { S.stack.pop(); render(); }); }
  else if (act === 'live-leave') { liveStop(); if (LIVE.role === 'player') LIVE.code = ''; transition('back', () => { S.stack.pop(); render(); }); }
  else if (act === 'share-rank') { closeSheet(); shareRank(); }
  else if (act === 'share-result') {
    const n = Q.md.qs.length, ok = Q.ans.filter(x => x && x.ok).length, pct = Math.round(ok / n * 100);
    shareCard({ big: Q.m === -2 ? '⚡' : `${pct}%`, title: Q.m === -2 ? (ok ? 'حللت تحدّي اليوم!' : 'شاركت في تحدّي اليوم') : Q.md.t, sub: Q.m === -2 ? `${G().name} · 🔥 ${dayWord(Math.max(dailyStreak(), 1))}` : `${ok} من ${n} إجابات صحيحة · ${G().name}`, text: `حصلت على ${pct}% في «${Q.md.t}» على Physics Tube. هل تتغلب عليّ؟ https://physics-tube.com/` });
  }
  else if (act === 'card-share') { if (CARD) navigator.share({ files: [CARD.file], text: CARD.text }).catch(() => {}); }
  else if (act === 'notice-edit') noticeSheet();
  else if (act === 'notice-ics') noticeIcs();
  else if (act === 'notice-save') {
    const v = id => (document.getElementById(id).value || '').trim(), title = v('nt-title');
    if (!title) return toast('اكتب عنوان الإعلان');
    const n = { title, date: v('nt-date'), time: v('nt-time'), unit: v('nt-unit'), note: v('nt-note') }, cur = getNotice();
    n.at = cur && cur.date === n.date && cur.at ? cur.at : Date.now();
    const all = document.getElementById('nt-all').checked, keys = all ? Object.keys(GRADES).map(g => `notice.${g}`) : [noticeKey()];
    (async () => {
      for (const k of keys) if (!await saveRow(k, { video: JSON.stringify(k === noticeKey() ? n : Object.assign({}, n, { unit: '' })) })) return;
      closeSheet(); toast(all ? 'تم نشر الموعد لجميع الصفوف' : 'تم نشر الإعلان للطلاب');
    })();
  }
  else if (act === 'notice-del') {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.textContent = 'اضغط مرة أخرى للتأكيد'; return; }
    saveRow(noticeKey(), { video: '' }).then(ok => { if (ok) { closeSheet(); toast('تم حذف الإعلان'); } });
  }
  else if (act === 'q-other') transition('back', () => { S.stack.pop(); render(); });
  else if (act === 'q-review') { Q.review = !Q.review; render(false); }
  else if (act === 'play-part') { S.vi = +el.dataset.j; render(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (act === 'add-video') {
    const url = document.getElementById('ed-video').value.trim(), title = document.getElementById('ed-title').value.trim(), min = document.getElementById('ed-min').value.trim().replace(/[^0-9]/g, '');
    if (!url) return toast('الصق رابط الفيديو أولاً');
    const vs0 = videoSource(url);
    if (!vs0) return toast('الرابط غير صحيح. انسخ رابط الفيديو كاملاً، ويبدأ بـ https://');
    if (/vm\.tiktok\.com|vt\.tiktok\.com|tiktok\.com\/t\//.test(url)) toast('هذا رابط تيك توك مختصر وسيفتح في تطبيق تيك توك. للتشغيل داخل التطبيق افتح الفيديو في المتصفح وانسخ الرابط الطويل.');
    const list = currentVideos(el.dataset.key).concat([{ url, title, min }]);
    el.classList.add('busy'); el.lastChild.textContent = 'جارٍ الحفظ…';
    saveVideos(el.dataset.key, list).then(ok => { if (ok) { S.vi = list.length - 1; render(false); toast('تمت إضافة الفيديو'); } else { el.classList.remove('busy'); el.lastChild.textContent = 'إضافة الفيديو'; } });
  }
  else if (act === 'vid-del') {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.classList.add('confirm'); return toast('اضغط مرة أخرى لحذف الفيديو'); }
    const list = currentVideos(el.dataset.key); list.splice(+el.dataset.j, 1);
    S.vi = 0; saveVideos(el.dataset.key, list).then(ok => ok && toast('تم حذف الفيديو'));
  }
  else if (act === 'file-del') {
    if (!el.dataset.confirm) { el.dataset.confirm = '1'; el.classList.add('confirm'); return toast('اضغط مرة أخرى لحذف الملف'); }
    const list = unitFiles(UNIT_BY_ID[el.dataset.key]).slice(); list.splice(+el.dataset.j, 1);
    saveFiles(el.dataset.key, list).then(ok => ok && toast('تم حذف الملف'));
  }
  else if (act === 'file-up') {
    const list = unitFiles(UNIT_BY_ID[el.dataset.key]).slice(), j = +el.dataset.j; [list[j - 1], list[j]] = [list[j], list[j - 1]];
    saveFiles(el.dataset.key, list);
  }
  else if (act === 'file-link') {
    const url = (document.getElementById('uf-url').value || '').trim(), kind = document.getElementById('uf-kind').value, title = document.getElementById('uf-title').value.trim();
    if (!/^https?:\/\//i.test(url)) return toast('الصق رابطاً كاملاً يبدأ بـ https://');
    const list = unitFiles(UNIT_BY_ID[el.dataset.key]).concat([{ url, kind, title }]);
    saveFiles(el.dataset.key, list).then(ok => ok && toast(`تمت إضافة «${title || FILE_KINDS[kind].t}»`));
  }
  else if (act === 'del-pdf') {
    if (el.dataset.confirm) saveRow(el.dataset.key, { pdf: '' }).then(ok => ok && toast('تم حذف المذكرة'));
    else { el.dataset.confirm = '1'; el.textContent = 'تأكيد الحذف'; }
  }
  else if (act === 'reset') {
    if (el.dataset.confirm) { S.watched = {}; store.set('watched', {}); S.last = null; store.set('last', null); render(false); toast('تم مسح التقدّم'); }
    else { el.dataset.confirm = '1'; el.querySelector('small').textContent = 'اضغط مرة أخرى للتأكيد'; }
  }
});
document.addEventListener('change', e => {
  const uf = e.target.closest('[data-ufile]');
  if (uf && db) return uploadUnitFile(uf.dataset.ufile, uf.files[0], document.querySelector('label[for="uf-file"]'));
  const inp = e.target.closest('[data-upload]');
  if (inp && db) return uploadPdf(inp.dataset.upload, inp.files[0], inp.previousElementSibling);
  const pos = e.target.closest('[data-vid-pos]');
  if (pos) {
    const list = currentVideos(pos.dataset.vidPos), from = +pos.dataset.j, to = +pos.value;
    if (from === to) return;
    const [moved] = list.splice(from, 1); list.splice(to, 0, moved);
    S.vi = to; saveVideos(pos.dataset.vidPos, list).then(ok => ok && toast(`نُقل الفيديو إلى الترتيب ${to + 1}`));
    return;
  }
  const ttl = e.target.closest('[data-vid-title]');
  if (ttl) {
    const list = currentVideos(ttl.dataset.vidTitle), j = +ttl.dataset.j;
    if (!list[j] || list[j].title === ttl.value.trim()) return;
    list[j].title = ttl.value.trim();
    saveVideos(ttl.dataset.vidTitle, list).then(ok => ok && toast('تم حفظ العنوان'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'live-code') { e.preventDefault(); liveJoin(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'q-in') { e.preventDefault(); const b = document.querySelector('[data-act="q-check"]'); if (b) b.click(); }
});
// Notes (PDF links) need an account too.
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-gate]'); if (!a) return;
  if (!needLogin(() => toast('اضغط على المذكرة مرة أخرى لفتحها'))) { e.preventDefault(); e.stopPropagation(); return; }
  logEvent('pdf', a.dataset.gate);
}, true);
document.addEventListener('input', e => {
  if (e.target.id !== 'st-search') return;
  ADMIN_DATA.q = e.target.value; const box = document.getElementById('st-list'); if (box) box.innerHTML = studentRows();
});

const start = (location.hash || '').slice(1);
if (['home', 'lab', 'notes', 'profile'].includes(start)) S.tab = start;
render();
if (db) {
  db.auth.getSession().then(({ data }) => applySession(data.session));
  db.from('profiles').select('id').limit(1).then(({ error }) => { ACCOUNTS = !error; if (ACCOUNTS) render(false); }, () => {});
  db.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { USER = ADMIN = PROFILE = null; } });
  loadRemote();
}
if (start === 'admin') { S.tab = 'profile'; render(); authSheet('login'); }
else if (!store.get('onboarded', false) && !store.get('gradePicked', false) && !totalWatched() && !S.last) onboarding();
else store.set('onboarded', true);

if ('serviceWorker' in navigator && CAN_EMBED && location.protocol === 'https:') {
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
    }).catch(() => {});
    // When a new version takes over, reload once so the latest app shows straight away.
    let reloaded = false, hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } hadController = true; });
  } catch (e) {}
}
</script>
<script src="games.js"></script>
</body>
</html>
