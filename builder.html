<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منشئ التطبيقات التعليمية</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="touch" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0B1220;--card:#141C2E;--line:#25324D;--tx:#F2F4F8;--mut:#9AA7BF;--c:#4F8CFF;--ok:#2DD4A0;--bad:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.55}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
input{width:100%;background:#0E1626;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
input:focus{border-color:var(--c)}
input::placeholder{color:#5F6E8C}
a{color:var(--c)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:22px;margin:22px 0 6px}h3{font-size:18px;margin:0}
p{margin:0}.mut{color:var(--mut)}.sm{font-size:14px}
.top{padding:calc(18px + env(safe-area-inset-top)) 0 8px}
.steps{display:flex;gap:8px;margin:14px 0 6px}
.steps button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-size:13px;color:var(--mut)}
.steps button.on{background:var(--c);border-color:var(--c);color:#06101F;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.lab{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.ic{display:flex;gap:8px;flex-wrap:wrap}
.ic button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#0E1626;font-size:26px}
.ic button.on{border-color:var(--c)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--c);color:#06101F;font-size:16px}
.btn.alt{background:#1D2943;color:var(--tx)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.del{background:transparent;color:var(--bad);padding:6px 10px}
.btn.full{width:100%}
.lesson{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(11,18,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:10px}.bar .btn{flex:1}
.note{background:#1A2540;border-radius:14px;padding:12px 14px;font-size:15px;color:#C9D3E6}
.link{word-break:break-all;direction:ltr;text-align:left;background:#0E1626;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:#C9D3E6;max-height:96px;overflow:auto}
.qr{background:#fff;border-radius:16px;padding:14px;width:220px;margin:12px auto}
.qr svg{width:100%;height:auto;display:block}
.err{color:var(--bad);font-size:15px;margin-top:8px}
/* ---------- المعروض للطالب ---------- */
.hero{background:linear-gradient(160deg,var(--c),#0B1220 130%);padding:calc(28px + env(safe-area-inset-top)) 0 26px}
.hero .e{font-size:54px;line-height:1}
.hero h1{margin-top:10px;font-size:28px}
.prog{height:8px;background:rgba(255,255,255,.22);border-radius:6px;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .3s}
.unit{margin:14px 0}
.unit h3{padding:6px 2px;color:var(--c)}
.ls{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}
.ls .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.ls.done .dot{background:var(--ok);border-color:var(--ok);color:#06101F}
.ls span.t{flex:1}
.tabs{position:fixed;inset:auto 0 0 0;display:flex;background:rgba(11,18,32,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:0;padding:8px;color:var(--mut);font-size:13px;display:grid;gap:2px;justify-items:center}
.tabs button b{font-size:22px;font-weight:400}.tabs button.on{color:var(--c)}
.sheet{position:fixed;inset:0;background:rgba(5,9,18,.72);display:flex;align-items:flex-end;z-index:5}
.sheet .in{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:12px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.opt.ok{border-color:var(--ok);background:#12332B}.opt.no{border-color:var(--bad);background:#3A1A22}
.big{font-size:56px;font-weight:800;text-align:center;margin:18px 0 4px;color:var(--c)}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:24px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const COLORS = ['#4F8CFF', '#2DD4A0', '#FF9F43', '#FF5D8F', '#A78BFA', '#22D3EE'];
const ICONS = ['⚛️', '🧪', '🧬', '📐', '📚', '🌍', '💻', '🔬', '🧮', '🎨', '🗣️', '⚽'];
const $ = s => document.querySelector(s);
const root = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- الترميز: التطبيق كله داخل الرابط، بلا خادم وبلا حسابات ----------
const b64u = b => { let s = ''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function encode(o) {
  const raw = new TextEncoder().encode(JSON.stringify(o));
  if (window.CompressionStream) {
    try { return 'z' + b64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); } catch {}
  }
  return 'p' + b64u(raw);
}
async function decode(code) {
  let raw = unb64u(code.slice(1));
  if (code[0] === 'z') raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return clean(JSON.parse(new TextDecoder().decode(raw)));
}
// الرابط قد يأتي من أي شخص، فنعيد بناء البيانات بأنواع وأطوال محدودة
function clean(o) {
  const s = (v, n) => String(v ?? '').slice(0, n);
  return {
    n: s(o.n, 60), s: s(o.s, 40), g: s(o.g, 40), t: s(o.t, 40),
    c: Math.min(Math.max(+o.c | 0, 0), COLORS.length - 1), e: s(o.e, 4) || '📚',
    u: (Array.isArray(o.u) ? o.u : []).slice(0, 30).map(u => ({ t: s(u.t, 80), l: (Array.isArray(u.l) ? u.l : []).slice(0, 60).map(l => ({ t: s(l.t, 100), v: s(l.v, 400), f: s(l.f, 400) })) })),
    q: (Array.isArray(o.q) ? o.q : []).slice(0, 60).map(q => ({ q: s(q.q, 300), a: s(q.a, 120), w: (Array.isArray(q.w) ? q.w : []).slice(0, 3).map(x => s(x, 120)) })),
  };
}
const blank = () => ({ n: '', s: '', g: '', t: '', c: 0, e: '⚛️', u: [{ t: '', l: [{ t: '', v: '', f: '' }] }], q: [] });
const sample = () => ({
  n: 'فيزياء الحادي عشر', s: 'الفيزياء', g: 'الحادي عشر علمي', t: 'أ. [اسمك]', c: 0, e: '⚛️',
  u: [
    { t: 'الوحدة الأولى: الحركة', l: [{ t: 'السرعة المتجهة والعددية', v: '', f: '' }, { t: 'التسارع', v: '', f: '' }, { t: 'معادلات الحركة', v: '', f: '' }] },
    { t: 'الوحدة الثانية: القوى', l: [{ t: 'قوانين نيوتن', v: '', f: '' }, { t: 'الاحتكاك', v: '', f: '' }] },
  ],
  q: [
    { q: 'وحدة قياس القوة في النظام الدولي هي:', a: 'نيوتن', w: ['جول', 'واط', 'باسكال'] },
    { q: 'الجسم الساكن محصلة القوى المؤثرة عليه:', a: 'صفر', w: ['تساوي وزنه', 'لا نهائية', 'سالبة دائماً'] },
  ],
});
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/); return m ? m[1] : ''; };
function setIcon(color, emoji) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, color); g.addColorStop(1, '#0B1220');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180); x.font = '100px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(emoji, 90, 98);
    $('#touch').href = c.toDataURL('image/png');
  } catch {}
}

// =====================================================================
// وضع المنشئ (للمعلم)
// =====================================================================
let app = blank(), step = 0, built = null;
const saveDraft = () => store.set('pb.draft', JSON.stringify(app));
const setPath = (o, path, v) => { const k = path.split('.'); const last = k.pop(); let t = o; k.forEach(p => t = t[p]); t[last] = v; };

function ready() {
  if (!app.n.trim()) return 'اكتب اسم التطبيق في الخطوة الأولى.';
  if (!app.u.some(u => u.l.some(l => l.t.trim()))) return 'أضف درساً واحداً على الأقل في الخطوة الثانية.';
  return '';
}
function stepView() {
  if (step === 0) return `
    <h2>هوية تطبيقك</h2><p class="mut">اختر الاسم والشكل، وكلها قابلة للتعديل لاحقاً.</p>
    <div class="card">
      <label class="lab">اسم التطبيق *</label><input data-b="n" maxlength="60" value="${esc(app.n)}" placeholder="مثال: كيمياء العاشر مع أ. سارة">
      <label class="lab">المادة</label><input data-b="s" maxlength="40" value="${esc(app.s)}" placeholder="مثال: الكيمياء">
      <label class="lab">الصف</label><input data-b="g" maxlength="40" value="${esc(app.g)}" placeholder="مثال: العاشر">
      <label class="lab">اسم المعلم</label><input data-b="t" maxlength="40" value="${esc(app.t)}" placeholder="مثال: أ. سارة">
      <label class="lab">اللون</label><div class="sw">${COLORS.map((c, i) => `<button data-a="color" data-i="${i}" class="${app.c === i ? 'on' : ''}" style="background:${c}" aria-label="لون ${ar(i + 1)}"></button>`).join('')}</div>
      <label class="lab">الأيقونة</label><div class="ic">${ICONS.map(e => `<button data-a="icon" data-e="${e}" class="${app.e === e ? 'on' : ''}">${e}</button>`).join('')}</div>
    </div>
    <button class="btn alt full" data-a="sample">جرّب بمثال جاهز لأرى الفكرة</button>`;
  if (step === 1) return `
    <h2>الوحدات والدروس</h2><p class="mut">أضف وحداتك ودروسها. رابط الفيديو والملف اختياريان، ويمكنك تركهما فارغين الآن.</p>
    ${app.u.map((u, ui) => `<div class="card">
      <div class="row"><input data-b="u.${ui}.t" maxlength="80" value="${esc(u.t)}" placeholder="اسم الوحدة (مثال: الوحدة الأولى)"><button class="btn del" data-a="del-unit" data-u="${ui}" aria-label="حذف الوحدة">حذف</button></div>
      ${u.l.map((l, li) => `<div class="lesson">
        <div class="row"><input data-b="u.${ui}.l.${li}.t" maxlength="100" value="${esc(l.t)}" placeholder="عنوان الدرس"><button class="btn del" data-a="del-lesson" data-u="${ui}" data-l="${li}" aria-label="حذف الدرس">×</button></div>
        <input data-b="u.${ui}.l.${li}.v" inputmode="url" dir="ltr" maxlength="400" value="${esc(l.v)}" placeholder="رابط الفيديو (يوتيوب أو تيك توك أو درايف...)">
        <input data-b="u.${ui}.l.${li}.f" inputmode="url" dir="ltr" maxlength="400" value="${esc(l.f)}" placeholder="رابط الملف أو المذكرة (اختياري)">
      </div>`).join('')}
      <button class="btn alt sm" style="margin-top:12px" data-a="add-lesson" data-u="${ui}">+ درس</button>
    </div>`).join('')}
    <button class="btn alt full" data-a="add-unit">+ وحدة جديدة</button>`;
  if (step === 2) return `
    <h2>اختبر نفسك <span class="mut sm">(اختياري)</span></h2><p class="mut">أسئلة اختيار من متعدد يجيب عنها الطالب في التطبيق. اكتب الإجابة الصحيحة ثم خيارات خاطئة، وسيخلطها التطبيق تلقائياً.</p>
    ${app.q.map((q, qi) => `<div class="card">
      <div class="row"><input data-b="q.${qi}.q" maxlength="300" value="${esc(q.q)}" placeholder="نص السؤال"><button class="btn del" data-a="del-q" data-q="${qi}" aria-label="حذف السؤال">حذف</button></div>
      <label class="lab" style="color:var(--ok)">الإجابة الصحيحة</label><input data-b="q.${qi}.a" maxlength="120" value="${esc(q.a)}">
      <label class="lab">ثلاثة خيارات خاطئة</label>
      ${[0, 1, 2].map(k => `<input style="margin-bottom:8px" data-b="q.${qi}.w.${k}" maxlength="120" value="${esc(q.w[k] || '')}">`).join('')}
    </div>`).join('')}
    <button class="btn alt full" data-a="add-q">+ سؤال</button>`;
  return `
    <h2>نشر التطبيق</h2>
    ${ready() ? `<div class="note">${esc(ready())}</div>` : `
    <div class="card"><p class="mut sm">رابط تطبيقك</p>
      <div class="link" id="lk">جارٍ التجهيز…</div>
      <div class="row" style="margin-top:12px"><button class="btn" data-a="copy" style="flex:1">نسخ الرابط</button><button class="btn alt" data-a="share" style="flex:1">مشاركة</button></div>
      <button class="btn alt full" style="margin-top:10px" data-a="open">افتح تطبيقك الآن</button>
      <div id="qr"></div>
      <p class="err" id="lkerr"></p>
    </div>
    <div class="note"><b>كيف يثبّته الطالب؟</b><br>يفتح الرابط في سفاري، ثم يضغط «مشاركة» ثم «إضافة إلى الشاشة الرئيسية». يصبح تطبيقاً على شاشته بالاسم والأيقونة التي اخترتها.</div>
    <div class="note" style="margin-top:12px"><b>مهم:</b> احتفظ بالرابط، فهو تطبيقك. أي تعديل تجريه هنا يعطيك رابطاً جديداً.</div>`}`;
}
function renderBuilder() {
  document.documentElement.style.setProperty('--c', COLORS[app.c]);
  root.innerHTML = `
  <div class="wrap top"><h1>أنشئ تطبيقك التعليمي</h1><p class="mut">أربع خطوات، وتحصل على رابط تطبيق جاهز لطلابك.</p>
    <div class="steps">${['الهوية', 'الدروس', 'الاختبار', 'النشر'].map((t, i) => `<button data-a="step" data-i="${i}" class="${step === i ? 'on' : ''}">${ar(i + 1)}. ${t}</button>`).join('')}</div></div>
  <div class="wrap" id="view">${stepView()}</div>
  <div class="bar"><div class="wrap">${step > 0 ? '<button class="btn alt" data-a="prev">السابق</button>' : ''}${step < 3 ? '<button class="btn" data-a="next">التالي</button>' : '<button class="btn alt" data-a="reset">ابدأ تطبيقاً جديداً</button>'}</div></div>`;
  window.scrollTo(0, 0);
  if (step === 3 && !ready()) publish();
}
async function publish() {
  const code = await encode(app);
  const url = location.origin + location.pathname + '#app=' + code;
  built = url; const lk = $('#lk'); if (!lk) return;
  lk.textContent = url;
  if (url.length > 6000) $('#lkerr').textContent = 'الرابط طويل نسبياً، وقد لا تقبله بعض التطبيقات. جرّب تقليل عدد الأسئلة أو الدروس.';
  if (url.length < 1500) {
    const draw = () => { try { const q = qrcode(0, 'L'); q.addData(url); q.make(); $('#qr').innerHTML = `<div class="qr">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>`; } catch {} };
    if (window.qrcode) draw(); else { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = draw; document.head.appendChild(s); }
  } else $('#qr').innerHTML = '<p class="mut sm" style="margin-top:12px">رمز QR يظهر عندما يكون التطبيق صغيراً. شارك الرابط مباشرة.</p>';
}
function builderEvents() {
  root.addEventListener('input', e => { const b = e.target.dataset.b; if (b) { setPath(app, b, e.target.value); saveDraft(); } });
  root.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const d = el.dataset, a = d.a;
    if (a === 'color') { app.c = +d.i; } else if (a === 'icon') { app.e = d.e; }
    else if (a === 'sample') { app = sample(); }
    else if (a === 'add-unit') app.u.push({ t: '', l: [{ t: '', v: '', f: '' }] });
    else if (a === 'del-unit') { app.u.splice(+d.u, 1); if (!app.u.length) app.u.push({ t: '', l: [{ t: '', v: '', f: '' }] }); }
    else if (a === 'add-lesson') app.u[+d.u].l.push({ t: '', v: '', f: '' });
    else if (a === 'del-lesson') { const u = app.u[+d.u]; u.l.splice(+d.l, 1); if (!u.l.length) u.l.push({ t: '', v: '', f: '' }); }
    else if (a === 'add-q') app.q.push({ q: '', a: '', w: ['', '', ''] });
    else if (a === 'del-q') app.q.splice(+d.q, 1);
    else if (a === 'next') step = Math.min(3, step + 1);
    else if (a === 'prev') step = Math.max(0, step - 1);
    else if (a === 'step') step = +d.i;
    else if (a === 'reset') { if (confirm('سيُمسح ما كتبته هنا. هل تريد البدء من جديد؟ (احتفظ برابط تطبيقك أولاً)')) { app = blank(); step = 0; } else return; }
    else if (a === 'copy') { try { await navigator.clipboard.writeText(built); el.textContent = 'تم النسخ ✓'; } catch { el.textContent = 'انسخه يدوياً من الأعلى'; } return; }
    else if (a === 'share') { try { await navigator.share({ title: app.n, url: built }); } catch {} return; }
    else if (a === 'open') { window.open(built, '_blank'); return; }
    saveDraft();
    // تغيير اللون أو الأيقونة لا يحتاج إعادة رسم كاملة حتى لا يضيع مكان الكتابة
    renderBuilder();
  });
}

// =====================================================================
// وضع الطالب: التطبيق نفسه
// =====================================================================
function viewer(a, code) {
  document.title = a.n || 'تطبيق تعليمي';
  document.documentElement.style.setProperty('--c', COLORS[a.c]);
  setIcon(COLORS[a.c], a.e);
  const pk = 'pb.' + code.length + '.' + [...code].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7);
  let done = {}; try { done = JSON.parse(store.get(pk) || '{}'); } catch {}
  const total = a.u.reduce((n, u) => n + u.l.filter(l => l.t.trim()).length, 0);
  let tab = 'lessons';
  const finished = () => Object.keys(done).filter(k => k !== 'best').length;
  function lessonSheet(ui, li) {
    const l = a.u[ui].l[li], v = safeUrl(l.v), f = safeUrl(l.f), y = ytId(v);
    const sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = `<div class="in"><h3>${esc(l.t)}</h3><p class="mut sm">${esc(a.u[ui].t)}</p>
      ${y ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${y}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(l.t)}"></iframe></div>` : v ? `<a class="btn full" style="display:block;text-align:center;text-decoration:none;margin:14px 0" href="${esc(v)}" target="_blank" rel="noopener noreferrer">شاهد الفيديو</a>` : '<div class="note" style="margin:14px 0">لم يضف المعلم فيديو لهذا الدرس بعد.</div>'}
      ${f ? `<a class="btn alt full" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="${esc(f)}" target="_blank" rel="noopener noreferrer">افتح المذكرة / الملف</a>` : ''}
      <button class="btn full" data-d="1">${done[ui + '.' + li] ? 'إلغاء علامة الإنجاز' : 'تم، أنهيت الدرس ✓'}</button>
      <button class="btn alt full" style="margin-top:10px" data-c="1">إغلاق</button></div>`;
    sh.addEventListener('click', e => {
      if (e.target === sh || e.target.dataset.c) sh.remove();
      else if (e.target.dataset.d) { const k = ui + '.' + li; if (done[k]) delete done[k]; else done[k] = 1; store.set(pk, JSON.stringify(done)); sh.remove(); draw(); }
    });
    document.body.appendChild(sh);
  }
  function lessonsView() {
    const n = finished(), pct = total ? Math.round(n / total * 100) : 0;
    return `<div class="hero"><div class="wrap"><div class="e">${esc(a.e)}</div><h1>${esc(a.n)}</h1>
      <p style="opacity:.9">${esc([a.s, a.g].filter(Boolean).join(' · '))}${a.t ? '<br>' + esc(a.t) : ''}</p>
      <div class="prog"><i style="width:${pct}%"></i></div><p class="sm" style="margin-top:6px;opacity:.9">أنجزت ${ar(n)} من ${ar(total)} درساً</p></div></div>
      <div class="wrap">${a.u.map((u, ui) => { const ls = u.l.map((l, li) => [l, li]).filter(([l]) => l.t.trim()); return ls.length ? `<div class="unit"><h3>${esc(u.t || 'الدروس')}</h3>${ls.map(([l, li]) => `<button class="ls ${done[ui + '.' + li] ? 'done' : ''}" data-ls="${ui}.${li}"><span class="dot">${done[ui + '.' + li] ? '✓' : ''}</span><span class="t">${esc(l.t)}</span><span class="mut">${l.v ? '▶' : ''}</span></button>`).join('')}</div>` : ''; }).join('') || '<div class="note" style="margin-top:20px">لم تتم إضافة دروس بعد.</div>'}</div>`;
  }
  // ----- الاختبار -----
  let qz = null;
  const qs = a.q.filter(q => q.q.trim() && q.a.trim());
  const shuffle = arr => { const r = arr.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
  function quizView() {
    const best = done.best;
    if (!qs.length) return '<div class="wrap" style="padding-top:calc(28px + env(safe-area-inset-top))"><div class="note">لا يوجد اختبار في هذا التطبيق.</div></div>';
    if (!qz) return `<div class="wrap" style="padding-top:calc(28px + env(safe-area-inset-top))"><h1>اختبر نفسك</h1><p class="mut">${ar(qs.length)} أسئلة اختيار من متعدد.</p>${best != null ? `<div class="note" style="margin-top:14px">أفضل نتيجة لك: ${ar(best)} من ${ar(qs.length)}</div>` : ''}<button class="btn full" style="margin-top:18px" data-qs="1">ابدأ الاختبار</button></div>`;
    if (qz.i >= qs.length) return `<div class="wrap" style="padding-top:calc(28px + env(safe-area-inset-top))"><p class="mut" style="text-align:center">نتيجتك</p><div class="big">${ar(qz.s)} / ${ar(qs.length)}</div><button class="btn full" style="margin-top:18px" data-qs="1">أعد المحاولة</button></div>`;
    const q = qs[qz.i];
    return `<div class="wrap" style="padding-top:calc(28px + env(safe-area-inset-top))"><p class="mut sm">السؤال ${ar(qz.i + 1)} من ${ar(qs.length)}</p><h3 style="margin:8px 0 12px;font-size:21px">${esc(q.q)}</h3>
      ${qz.o.map(o => `<button class="opt ${qz.p != null ? (o === q.a ? 'ok' : o === qz.p ? 'no' : '') : ''}" data-o="${esc(o)}" ${qz.p != null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}
      ${qz.p != null ? '<button class="btn full" style="margin-top:10px" data-nx="1">' + (qz.i + 1 < qs.length ? 'السؤال التالي' : 'النتيجة') + '</button>' : ''}</div>`;
  }
  const quizStart = () => { qz = { i: 0, s: 0, p: null, o: shuffle([qs[0].a, ...qs[0].w.filter(x => x.trim())]) }; };
  function aboutView() {
    return `<div class="wrap" style="padding-top:calc(28px + env(safe-area-inset-top))"><h1>${esc(a.e)} ${esc(a.n)}</h1><p class="mut">${esc([a.s, a.g, a.t].filter(Boolean).join(' · '))}</p>
      <div class="note" style="margin-top:16px"><b>ثبّت التطبيق على جوالك</b><br>اضغط «مشاركة» في المتصفح ثم «إضافة إلى الشاشة الرئيسية».</div>
      <div class="foot">صُنع بمنشئ التطبيقات التعليمية<br><a href="builder.html">أنشئ تطبيقك الخاص</a> · <a href="builder.html#edit=${esc(code)}">تعديل هذا التطبيق</a></div></div>`;
  }
  function draw() {
    const tabs = [['lessons', '📖', 'الدروس']].concat(qs.length ? [['quiz', '✅', 'اختبر نفسك']] : [], [['about', 'ℹ️', 'حول']]);
    root.innerHTML = (tab === 'lessons' ? lessonsView() : tab === 'quiz' ? quizView() : aboutView()) + `<div style="height:20px"></div><nav class="tabs">${tabs.map(([k, ic, t]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}"><b>${ic}</b>${t}</button>`).join('')}</nav>`;
  }
  root.onclick = e => {
    const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
    if (d.t) { tab = d.t; qz = null; draw(); window.scrollTo(0, 0); }
    else if (d.ls) { const [u, l] = d.ls.split('.'); lessonSheet(+u, +l); }
    else if (d.qs) { quizStart(); draw(); }
    else if (d.o != null && qz && qz.p == null) { qz.p = d.o; if (d.o === qs[qz.i].a) qz.s++; draw(); }
    else if (d.nx) { qz.i++; qz.p = null; if (qz.i < qs.length) qz.o = shuffle([qs[qz.i].a, ...qs[qz.i].w.filter(x => x.trim())]); else { if (done.best == null || qz.s > done.best) { done.best = qz.s; store.set(pk, JSON.stringify(done)); } } draw(); window.scrollTo(0, 0); }
  };
  draw();
}

// ---------- التشغيل ----------
async function boot() {
  const h = location.hash;
  try {
    if (h.startsWith('#app=')) { const c = h.slice(5); viewer(await decode(c), c); return; }
    if (h.startsWith('#edit=')) app = await decode(h.slice(6));
    else { const d = store.get('pb.draft'); if (d) app = clean(JSON.parse(d)); }
  } catch {
    root.innerHTML = '<div class="wrap top"><h1>تعذّر فتح هذا الرابط</h1><p class="mut">قد يكون الرابط ناقصاً. اطلب من المعلم إرساله مرة أخرى.</p><p style="margin-top:16px"><a href="builder.html">أنشئ تطبيقك الخاص</a></p></div>';
    return;
  }
  if (!app.u.length) app.u = blank().u;
  renderBuilder(); builderEvents();
}
addEventListener('hashchange', () => location.reload());
boot();
</script>
</body>
</html>
