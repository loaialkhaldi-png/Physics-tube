      body = '<div class="vempty"><p>تعذّر عرض هذا الفيديو.</p></div>';
    }
    return '<div class="vitem">' + (t ? '<h3 class="vt">' + t + '</h3>' : '') + body +
      (cap.edit ? '<div><button class="btn ghost bad vdelb" data-a="vdel" data-id="' + escAttr(v.id) + '">حذف هذا الفيديو</button></div>' : '') + '</div>';
  }
  function videoBlock(s, i) {
    var list = vlist(s.id, i), main;
    if (!list.length) {
      main = '<div class="vempty"><p>' + (cap.edit ? 'ما أضفت فيديو لهذا الدرس بعد.' : 'الفيديو ما انضاف بعد لهذا الدرس.') + '</p></div>';
    } else {
      main = '<div class="vlist">' + list.map(function (v, n) { return videoItem(v, n, list.length); }).join('') + '</div>';
    }
    return main + (cap.edit ? adminPanel(list.length) : '');
  }
  function vmsg(t, bad) {
    var el = $('vmsg');
    if (el) { el.textContent = t; el.className = 'vmsg' + (bad ? ' bad' : ''); }
  }
  function vErr(e) {
    var m = {
      too_large: 'حجم الملف أكبر من الحد المسموح (20MB).',
      unsupported_type: 'هذي الصيغة غير مدعومة. استخدم mp4 أو webm.',
      quota_or_state: 'مساحة التخزين ممتلئة. احذف فيديو قديم أو استخدم رابطاً.',
      quota_exceeded: 'امتلأ حد البيانات المسموح.',
      rate_limited: 'محاولات كثيرة، انتظر شوي وجرّب مرة ثانية.',
      invalid_argument: 'ما عندك صلاحية الحفظ هنا.',
      store_unavailable: 'مشكلة مؤقتة، جرّب مرة ثانية.'
    }[e && e.code];
    vmsg(m || 'ما انحفظ الفيديو. جرّب مرة ثانية.', true);
  }
  function dropOld(old) {
    if (old && old.kind === 'file' && old.asset && cap.assets) return cap.assets.delete(old.asset).catch(function () {});
  }
  function newId(key) { return key + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function vTitle() { var t = $('vtitle'); return t ? t.value.trim().slice(0, 80) : ''; }
  function vUpload() {
    if (!cap.edit || vbusy) return;
    var inp = $('vfile'), f = inp && inp.files && inp.files[0];
    if (!f) { vmsg('اختر ملف الفيديو أولاً.', true); return; }
    var type = f.type;
    if (!type) { var mt = /\.(mp4|webm)$/i.exec(f.name); type = mt ? 'video/' + mt[1].toLowerCase() : ''; }
    if (type !== 'video/mp4' && type !== 'video/webm') { vmsg('الصيغة المدعومة هي mp4 أو webm فقط.', true); return; }
    if (f.size > 20 * 1024 * 1024) { vmsg('حجم الملف أكبر من 20MB. ارفعه على يوتيوب وحط الرابط بدل الرفع.', true); return; }
    var key = curKey(), title = vTitle(), id = newId(key);
    vbusy = true; vmsg('جاري الرفع...');
    cap.assets.upload(f, { type: type }).then(function (res) {
      return cap.db.doc('videos/' + id).set({ lesson: key, kind: 'file', asset: res.id, title: title, name: f.name, size: res.sizeBytes, at: Date.now() });
    }).then(function () { vbusy = false; vmsg('تمت إضافة الفيديو.'); }).catch(function (e) { vbusy = false; vErr(e); });
  }
  function vLink() {
    if (!cap.edit || vbusy) return;
    var inp = $('vlink'), raw2 = inp ? inp.value.trim() : '', u = null;
    try { u = new URL(raw2); } catch (e) {}
    if (!u || u.protocol !== 'https:') { vmsg('اكتب رابطاً صحيحاً يبدأ بـ https://', true); return; }
    var key = curKey(), title = vTitle(), id = newId(key);
    vbusy = true; vmsg('جاري الحفظ...');
    cap.db.doc('videos/' + id).set({ lesson: key, kind: 'link', href: u.href, title: title, at: Date.now() })
      .then(function () { vbusy = false; vmsg('تمت إضافة الرابط.'); })
      .catch(function (e) { vbusy = false; vErr(e); });
  }
  function vDelete(btn) {
    if (!cap.edit || vbusy) return;
    var id = btn.getAttribute('data-id');
    if (ui.vdel !== id) {
      var all = document.querySelectorAll('.vdelb');
      for (var q = 0; q < all.length; q++) all[q].textContent = 'حذف هذا الفيديو';
      ui.vdel = id; btn.textContent = 'اضغط مرة ثانية للحذف النهائي'; return;
    }
    var v = vlist(ui.lesson.s, ui.lesson.i).filter(function (x) { return x.id === id; })[0];
    ui.vdel = false; vbusy = true;
    cap.db.doc('videos/' + id).delete()
      .then(function () { return dropOld(v); })
      .then(function () { vbusy = false; })
      .catch(function (e) { vbusy = false; vErr(e); });
  }
  function refreshLists() {
    if (ui.tab === 'home' && $('gradeTiles')) $('gradeTiles').innerHTML = tilesHtml();
    else if (ui.tab === 'subjects' && $('lres')) $('lres').innerHTML = lessonRows();
    else if (ui.tab === 'progress') render(false);
  }
  function onVideos(snap) {
    var next = {}, changed = {}, any = false, k;
    snap.docs.forEach(function (d) {
      if (!d.exists) return;
      var x = d.data(), lk = x.lesson || (/^g1[0-2]-\d+$/.test(d.id) ? d.id : null);
      if (!lk) return;
      (next[lk] = next[lk] || []).push({ id: d.id, kind: x.kind, asset: x.asset, href: x.href, title: x.title || '', at: x.at || 0 });
    });
    Object.keys(next).forEach(function (key) {
      next[key].sort(function (a, b) { return (a.at - b.at) || (a.id < b.id ? -1 : 1); });
      if (JSON.stringify(next[key]) !== JSON.stringify(vids[key])) changed[key] = 1;
    });
    Object.keys(vids).forEach(function (key) { if (!next[key]) changed[key] = 1; });
    vids = next;
    for (k in changed) { any = true; break; }
    if (!any) return;
    if (ui.lesson) { if (changed[curKey()]) render(false); }
    else refreshLists();
  }
  function initCaps() {
    var c = window.claude;
    if (!c || !c.use) return;
    Promise.all([c.use('db'), c.use('assets'), c.use('user')]).then(function (r) {
      cap.db = r[0]; cap.assets = r[1];
      if (!cap.db) return;
      var pe = r[2] ? r[2].canEdit() : Promise.resolve(true);
      return pe.then(function (ok) {
        cap.edit = !!(cap.assets && ok);
        cap.db.collection('videos').onSnapshot(onVideos, function () {});
        if (cap.edit && ui.lesson) render(false);
      });
    }).catch(function () {});
  }
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'VIDEO') {
      var d = document.createElement('div');
      d.className = 'vempty';
      d.innerHTML = '<p>تعذّر تشغيل الفيديو. أعد تحميل الصفحة أو جرّب لاحقاً.</p>';
      t.replaceWith(d);
    }
  }, true);

  /* ---------- views ---------- */
  function tilesHtml() {
    return SUBJECTS.map(function (s) {
      var d = doneCount(s), n = s.lessons.length, vc = vcount(s);
      return '<button class="card tile" data-a="subj" data-v="' + s.id + '"><span class="gn">' + s.glyph + '</span><h3>' + s.name + '</h3>' +
        '<p class="meta">' + chapterCount(s) + ' فصول · <span class="num">' + d + '</span> من <span class="num">' + n + '</span> دروس' + (vc ? ' · <span class="num">' + vc + '</span> فيديو' : '') + '</p>' + bar(pct(d, n)) + '</button>';
    }).join('');
  }

  function home() {
    var nx = nextLesson();
    var cont = nx
      ? '<section class="card"><p class="eyebrow">تابع من حيث وقفت</p><h2 class="sec-t">' + nx.l.t + '</h2><p class="note">' + nx.s.name + ' · <span class="num">' + nx.l.m + '</span> دقيقة</p><div><button class="btn" data-a="open" data-s="' + nx.s.id + '" data-i="' + nx.i + '">ابدأ الدرس</button></div></section>'
      : '<section class="card"><p class="eyebrow">أحسنت</p><h2 class="sec-t">أنهيت كل الدروس المتاحة</h2><div><button class="btn" data-a="tab" data-v="quiz">اختبر نفسك</button></div></section>';
    return topbar() +
      '<section class="hero"><div><p class="eyebrow">الصف العاشر · الحادي عشر · الثاني عشر</p><h1>الفيزياء <mark>تنفهم</mark>، مو تنحفظ.</h1>' +
      '<p class="lead">دروس مرتبة على فصول كتابك، وفيديو وتجربة تفاعلية وملخص واختبار لكل درس. وقبل لا تبدأ، جرّب بنفسك: غيّر الزاوية والسرعة وشوف وين تنزل الكرة.</p>' +
      '<div class="cta"><button class="btn" data-a="tab" data-v="subjects">ابدأ الدروس</button><button class="btn alt" data-a="tab" data-v="quiz">اختبر نفسك</button></div></div>' +
      '<div class="sim" id="simhome"></div></section>' +
      cont +
      '<section class="head"><p class="eyebrow">// الصفوف</p><h2 class="sec-h">ابدأ من صفك</h2><p class="sec-p">الدروس مأخوذة من فهرس الجزء الأول في كتاب كل صف، بنفس ترتيب الفصول.</p></section>' +
      '<div class="grades" id="gradeTiles">' + tilesHtml() + '</div>' +
      '<section class="head"><p class="eyebrow">// تقرير المختبر</p><h2 class="sec-h">شنو في كل درس</h2></section>' +
      '<div class="sheet"><div class="cap"><span>FIZYA TUBE</span><span>4 أدوات</span></div>' +
      '<div class="sline"><span class="sym">v</span><div><h3>فيديو الشرح</h3><p>مقطع لكل درس تضيفه أنت، ويقدر الطالب يعيده بالسرعة اللي تناسبه.</p></div></div>' +
      '<div class="sline"><span class="sym">θ</span><div><h3>تجربة تفاعلية</h3><p>في الدروس اللي تنفع فيها: مقذوفات وسقوط حر وحركة دائرية وتصادمات. تغيّر الأرقام وتشوف النتيجة.</p></div></div>' +
      '<div class="sline"><span class="sym">Σ</span><div><h3>ملخص الدرس</h3><p>القوانين والوحدات في صفحة وحدة تراجع منها قبل الاختبار.</p></div></div>' +
      '<div class="sline"><span class="sym">✓</span><div><h3>اختبار قصير</h3><p>أسئلة بتصحيح فوري وشرح للإجابة، وتتابع تقدمك في كل صف.</p></div></div></div>' +
      '<p class="note">عناوين الدروس مأخوذة من فهارس كتب الفيزياء، أما الملخصات والأسئلة فأمثلة للتجربة وتحتاج مراجعة معلم.</p>';
  }

  function rowHtml(s, i, showGrade) {
    var l = s.lessons[i], on = isDone(s, i);
    return '<button class="row" data-a="open" data-s="' + s.id + '" data-i="' + i + '"><span class="dot' + (on ? ' on' : '') + '">' + (on ? ICON_CHECK : '') + '</span>' +
      '<span class="txt"><span class="t">' + l.t + '</span><br><span class="m">' + (showGrade ? s.name + ' · ' : '') + 'الدرس <bdi dir="ltr" class="f">' + l.k + '</bdi> · <span class="num">' + l.m + '</span> دقيقة' +
      (on ? ' · مكتمل' : '') + (vlist(s.id, i).length ? ' · <span class="vtag">' + (vlist(s.id, i).length > 1 ? vlist(s.id, i).length + ' فيديوهات' : 'فيديو') + '</span>' : '') + '</span></span>' + ICON_CHEV + '</button>';
  }
  function lessonRows() {
    var q = norm(ui.search), out = '', n = 0;
    if (q) {
      SUBJECTS.forEach(function (s) {
        s.lessons.forEach(function (l, i) {
          if (norm(l.t).indexOf(q) >= 0 || norm(l.c).indexOf(q) >= 0 || l.k.indexOf(q) >= 0) { out += rowHtml(s, i, true); n++; }
        });
      });
      return n ? out : '<p class="note">ما لقينا درس بهذا الاسم. جرّب كلمة ثانية.</p>';
    }
    var s = byId(ui.subj), prev = '';
    s.lessons.forEach(function (l, i) {
      if (l.c !== prev) { out += '<h3 class="chap">' + l.c + '</h3>'; prev = l.c; }
      out += rowHtml(s, i, false);
    });
    return out;
  }
  function subjects() {
    var s = byId(ui.subj);
    return topbar() + '<h1 class="page-h">الدروس</h1>' +
      '<input id="q" class="search" type="search" placeholder="ابحث عن درس، مثلاً: مقذوفات" value="' + escAttr(ui.search) + '" aria-label="ابحث عن درس">' +
      chips(ui.subj, 'subj') +
      '<div class="prow"><div class="line"><span>' + s.name + '</span><span><span class="num">' + doneCount(s) + '</span> من <span class="num">' + s.lessons.length + '</span></span></div>' + bar(pct(doneCount(s), s.lessons.length)) + '</div>' +
      '<div class="rows" id="lres">' + lessonRows() + '</div>';
  }

  function lessonView() {
    var s = byId(ui.lesson.s), i = ui.lesson.i, l = s.lessons[i], on = isDone(s, i);
    return '<div class="backbar"><button class="back" data-a="back">' + ICON_BACK + 'رجوع</button></div>' +
      '<div><p class="note">' + s.name + ' · ' + l.c + '</p><h1 class="lesson-h">' + l.t + '</h1></div>' +
      videoBlock(s, i) +
      (SIMMAP[s.id + ':' + l.k] ? '<div class="sim" id="simbox"></div>' : '') +
      '<section class="card"><h2 class="sec-t">ملخص الدرس</h2><ul class="notes">' + l.n.map(function (x) { return '<li>' + L(x) + '</li>'; }).join('') + '</ul></section>' +
      '<button class="btn block ' + (on ? 'ghost' : '') + '" data-a="finish">' + (on ? ICON_CHECK + ' تم إنهاء الدرس' : 'أنهيت الدرس') + '</button>' +
      '<button class="btn block alt" data-a="qgo" data-v="' + s.id + '">اختبر نفسك في ' + s.name + '</button>';
  }

  function quiz() {
    if (!ui.q) {
      var s = byId(ui.qs), b = st.best[s.id];
      return topbar() + '<h1 class="page-h">اختبار</h1>' + chips(ui.qs, 'qsubj') +
        '<section class="card" style="align-items:flex-start"><h2 class="sec-t">' + s.name + '</h2><p><span class="num">' + s.quiz.length + '</span> أسئلة · ' + (b != null ? 'أفضل نتيجة <span class="num">' + b + '</span> من <span class="num">' + s.quiz.length + '</span>' : 'لم تحاول بعد') + '</p><button class="btn" data-a="qstart">ابدأ الاختبار</button></section>';
    }
    var q = ui.q, sb = byId(q.s), n = sb.quiz.length;
    if (q.done) {
      var msg = q.score === n ? 'ممتاز، إجاباتك كلها صحيحة.' : (q.score * 2 >= n ? 'جيد، راجع الأسئلة اللي أخطأت فيها.' : 'راجع دروس الصف ثم أعد المحاولة.');
      return topbar() + '<h1 class="page-h">النتيجة</h1>' +
        '<section class="card" style="align-items:flex-start"><p class="note">' + sb.name + '</p><p class="score num">' + q.score + ' / ' + n + '</p><p>' + msg + '</p>' +
        '<button class="btn" data-a="qretry">أعد الاختبار</button><button class="btn ghost" data-a="qexit">اختبار صف آخر</button><button class="btn ghost" data-a="subj" data-v="' + sb.id + '">راجع الدروس</button></section>';
    }
    var item = sb.quiz[q.i], answered = q.pick !== null;
    var opts = item.o.map(function (o, k) {
      var cls = 'opt', lab = '';
      if (answered) {
        if (k === item.a) { cls += ' right'; lab = 'صحيحة'; }
        else if (k === q.pick) { cls += ' wrong'; lab = 'خاطئة'; }
      }
      return '<button class="' + cls + '" data-a="qpick" data-v="' + k + '"' + (answered ? ' disabled' : '') + '><span>' + L(o) + '</span><span class="lab">' + lab + '</span></button>';
    }).join('');
    var last = q.i + 1 === n;
    return topbar() + '<div class="qhead"><span>' + sb.name + '</span><span>السؤال <span class="num">' + (q.i + 1) + '</span> من <span class="num">' + n + '</span></span></div>' + bar(pct(q.i + (answered ? 1 : 0), n)) +
      '<h2 class="qtext">' + L(item.q) + '</h2><div class="rows">' + opts + '</div>' +
      (answered ? '<div class="explain">' + L(item.e) + '</div><div><button class="btn" data-a="qnext">' + (last ? 'عرض النتيجة' : 'السؤال التالي') + '</button></div>' : '');
  }

  function progress() {
    var tot = totalLessons(), d = 0, mins = 0, allMins = 0;
    SUBJECTS.forEach(function (s) { s.lessons.forEach(function (l, i) { allMins += l.m; if (isDone(s, i)) { d++; mins += l.m; } }); });
    var rows = SUBJECTS.map(function (s) {
      var c = doneCount(s), b = st.best[s.id];
      return '<div class="prow"><div class="line"><span>' + s.name + '</span><span><span class="num">' + c + '</span> من <span class="num">' + s.lessons.length + '</span> دروس · ' + (b != null ? 'الاختبار <span class="num">' + b + '/' + s.quiz.length + '</span>' : 'بلا اختبار') + '</span></div>' + bar(pct(c, s.lessons.length)) + '</div>';
    }).join('');
    return topbar() + '<h1 class="page-h">تقدمي</h1>' +
      '<section class="card"><p class="big num">' + pct(d, tot) + '%</p><p>أنهيت <span class="num">' + d + '</span> من <span class="num">' + tot + '</span> درساً</p><p class="note">وقت الدراسة المكتمل: <span class="num">' + mins + '</span> من <span class="num">' + allMins + '</span> دقيقة</p></section>' +
      '<section class="card" style="gap:16px"><h2 class="sec-t">حسب الصف</h2>' + rows + '</section>' +
      '<button class="link" data-a="reset">' + (ui.cr ? 'اضغط مرة ثانية لمسح تقدمك' : 'مسح التقدم') + '</button>';
  }

  var views = { home: home, subjects: subjects, quiz: quiz, progress: progress };

  function render(scroll) {
    stopSim();
    var v = $('view'), isHome = !ui.lesson && ui.tab === 'home';
    v.className = 'wrap' + (isHome ? '' : ' narrow');
    v.innerHTML = ui.lesson ? lessonView() : views[ui.tab]();
    var tabs = document.querySelectorAll('.tab');
    for (var k = 0; k < tabs.length; k++) {
      if (tabs[k].getAttribute('data-v') === ui.tab && !ui.lesson) tabs[k].setAttribute('aria-current', 'page');
      else tabs[k].removeAttribute('aria-current');
    }
    if (isHome) mountSim($('simhome'), 'proj');
    else if (ui.lesson) {
      var s = byId(ui.lesson.s), sk = SIMMAP[s.id + ':' + s.lessons[ui.lesson.i].k];
      if (sk) mountSim($('simbox'), sk);
    }
    if (scroll !== false) window.scrollTo(0, 0);
  }

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') {
      ui.search = e.target.value;
      var r = $('lres'); if (r) r.innerHTML = lessonRows();
    }
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v');
    switch (a) {
      case 'tab':
        ui.lesson = null; ui.tab = v; ui.cr = false; render(); break;
      case 'subj':
        ui.lesson = null; ui.tab = 'subjects'; ui.subj = v; ui.search = ''; render(); break;
      case 'open':
        ui.tab = 'subjects'; ui.subj = b.getAttribute('data-s');
        ui.lesson = { s: b.getAttribute('data-s'), i: parseInt(b.getAttribute('data-i'), 10) };
        ui.vdel = false; render(); break;
      case 'back':
        ui.lesson = null; render(); break;
      case 'finish':
        var k = ui.lesson.s + ':' + ui.lesson.i;
        if (st.done[k]) delete st.done[k]; else st.done[k] = 1;
        save(); render(false); break;
      case 'qgo':
        ui.lesson = null; ui.tab = 'quiz'; ui.qs = v; ui.q = null; render(); break;
      case 'qsubj':
        ui.qs = v; render(false); break;
      case 'qstart':
        ui.q = { s: ui.qs, i: 0, pick: null, score: 0, done: false }; render(); break;
      case 'qpick':
        if (ui.q.pick !== null) break;
        ui.q.pick = parseInt(v, 10);
        if (ui.q.pick === byId(ui.q.s).quiz[ui.q.i].a) ui.q.score++;
        render(false); break;
      case 'qnext':
        var sb = byId(ui.q.s);
        if (ui.q.i + 1 < sb.quiz.length) { ui.q.i++; ui.q.pick = null; }
        else {
          ui.q.done = true;
          if (st.best[sb.id] == null || ui.q.score > st.best[sb.id]) st.best[sb.id] = ui.q.score;
          save();
        }
        render(); break;
      case 'qretry':
        ui.q = { s: ui.q.s, i: 0, pick: null, score: 0, done: false }; render(); break;
      case 'qexit':
        ui.q = null; render(); break;
      case 'vupload': vUpload(); break;
      case 'vlink': vLink(); break;
      case 'vdel': vDelete(b); break;
      case 'reset':
        if (!ui.cr) { ui.cr = true; render(false); }
        else { st = { done: {}, best: {} }; save(); ui.cr = false; render(false); }
        break;
    }
  });

  render(false);
  initCaps();
})();
</script>

</body></html>
